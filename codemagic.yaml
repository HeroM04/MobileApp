# ============================================================
#  Codemagic — build file iOS (.ipa) trên máy Mac đám mây
#
#  Dùng khi máy phát triển chạy Windows (không build được iOS).
#  Cách dùng: xem HUONG-DAN-DEPLOY-IOS.md, mục "Cách A".
#
#  Có 2 workflow:
#    - ios-testflight : build + tự đẩy lên TestFlight (dùng khi phát hành)
#    - ios-unsigned   : build thử KHÔNG cần tài khoản Apple (kiểm tra code)
# ============================================================

workflows:

  # ----------------------------------------------------------
  # 1) BUILD + PHÁT HÀNH LÊN TESTFLIGHT
  #    Yêu cầu: tài khoản Apple Developer (99 USD/năm) + App Store Connect API key
  # ----------------------------------------------------------
  ios-testflight:
    name: iOS - Build IPA va day len TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Nhóm biến chứa CERTIFICATE_PRIVATE_KEY — tạo trong Codemagic:
      # App settings > Environment variables, nhóm tên "appstore", đánh dấu Secure.
      # Đây là khóa riêng dùng để tạo và tái sử dụng chứng chỉ ký số.
      groups:
        - appstore
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "vn.trilongland.kpi"
        # Đường dẫn tới dự án Flutter bên trong repo
        FLUTTER_PROJECT_DIR: "kpi_mobile"
      # Không dùng khối ios_signing tự động vì nó chỉ TÌM profile có sẵn,
      # không tạo mới -> báo "No matching profiles found".
      # Thay vào đó tạo/tải chứng chỉ tường minh ở bước script bên dưới (--create).

    scripts:
      - name: Cai dat dependencies
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter pub get

      - name: Kiem tra loi bien dich
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Cai CocoaPods (thu vien iOS)
        script: |
          cd $FLUTTER_PROJECT_DIR/ios
          pod install --repo-update

      - name: Tao chung chi va provisioning profile
        script: |
          # Dung ngay khi co lenh loi, de khong am tham bo qua buoc ky so
          set -e

          echo "===== 1. Khoi tao kho chung chi ====="
          keychain initialize

          echo "===== 2. Tao/tai chung chi + profile cho $BUNDLE_ID ====="
          # --certificate-key: khoa rieng di kem chung chi. Apple KHONG giu khoa nay,
          #   thieu no se bao "Cannot save Signing Certificates without certificate
          #   private key". Dung 1 khoa co dinh luu trong bien moi truong de moi lan
          #   build deu tai lai dung chung chi cu, khong tao chung chi moi (Apple chi
          #   cho toi da 3 chung chi phan phoi).
          # --create: tao moi neu Apple chua co.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

          echo "===== 3. Nap chung chi vao keychain ====="
          keychain add-certificates

          echo "===== 4. Gan profile vao du an Xcode ====="
          xcode-project use-profiles

          echo "===== 5. KIEM TRA KET QUA ====="
          echo "--- Provisioning profile da tai ve ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null \
            || echo "!!! KHONG co profile nao"
          echo "--- Chung chi ky so trong keychain ---"
          security find-identity -v -p codesigning \
            || echo "!!! KHONG co chung chi nao"

      - name: Build IPA
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($PROJECT_BUILD_NUMBER + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - kpi_mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - kpi_mobile/flutter_drive.log

    # QUAN TRỌNG: tên dưới đây phải TRÙNG KHỚP với tên integration bạn tạo trong
    # Codemagic (Teams > Integrations > App Store Connect). Nếu bạn đặt tên khác,
    # sửa lại dòng này cho khớp, nếu không build sẽ báo lỗi không tìm thấy key.
    integrations:
      app_store_connect: trilong-appstore

    publishing:
      app_store_connect:
        auth: integration

        # Chỉ TẢI bản build lên App Store Connect, KHÔNG gửi duyệt External Testing.
        # Nhóm Internal Testing (tối đa 100 người) dùng được NGAY, Apple không cần duyệt
        # và không đòi Beta App Review Information — đủ cho app nội bộ.
        #
        # Đổi thành true nếu sau này cần External Testing (>100 người). Khi đó phải
        # điền trước phần Test Information trên App Store Connect, nếu không sẽ lỗi:
        #   "Complete test information is required ... for external testing"
        submit_to_testflight: false

        # Chỉ bật khi muốn phát hành công khai trên App Store
        submit_to_app_store: false
      email:
        recipients:
          - hunghot041103@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------
  # 2) BUILD THỬ KHÔNG KÝ SỐ
  #    KHÔNG cần tài khoản Apple. Dùng để kiểm tra code có build được không.
  #    File tạo ra KHÔNG cài lên máy thật được — chỉ để kiểm tra.
  # ----------------------------------------------------------
  ios-unsigned:
    name: iOS - Build thu (khong can tai khoan Apple)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        FLUTTER_PROJECT_DIR: "kpi_mobile"

    scripts:
      - name: Cai dat dependencies
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter pub get

      - name: Cai CocoaPods
        script: |
          cd $FLUTTER_PROJECT_DIR/ios
          pod install --repo-update

      - name: Build iOS khong ky so
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter build ios --release --no-codesign

    artifacts:
      - kpi_mobile/build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - hunghot041103@gmail.com
        notify:
          success: true
          failure: true
