# ============================================================
#  Codemagic — build file iOS (.ipa) trên máy Mac đám mây
#
#  Dùng khi máy phát triển chạy Windows (không build được iOS).
#  Cách dùng: xem HUONG-DAN-DEPLOY-IOS.md, mục "Cách A".
#
#  Có 2 workflow:
#    - ios-testflight : build + tự đẩy lên TestFlight (dùng khi phát hành)
#    - ios-unsigned   : build thử KHÔNG cần tài khoản Apple (kiểm tra code)
# ============================================================

workflows:

  # ----------------------------------------------------------
  # 1) BUILD + PHÁT HÀNH LÊN TESTFLIGHT
  #    Yêu cầu: tài khoản Apple Developer (99 USD/năm) + App Store Connect API key
  # ----------------------------------------------------------
  ios-testflight:
    name: iOS - Build IPA va day len TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Nhóm biến chứa CERTIFICATE_PRIVATE_KEY — tạo trong Codemagic:
      # App settings > Environment variables, nhóm tên "appstore", đánh dấu Secure.
      # Đây là khóa riêng dùng để tạo và tái sử dụng chứng chỉ ký số.
      groups:
        - appstore
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "vn.trilongland.kpi"
        # Đường dẫn tới dự án Flutter bên trong repo
        FLUTTER_PROJECT_DIR: "kpi_mobile"
      # Không dùng khối ios_signing tự động vì nó chỉ TÌM profile có sẵn,
      # không tạo mới -> báo "No matching profiles found".
      # Thay vào đó tạo/tải chứng chỉ tường minh ở bước script bên dưới (--create).

    scripts:
      # Cấu hình Firebase KHÔNG nằm trong Git (kho công khai) nên phải dựng lại
      # từ biến môi trường. Thiếu biến thì bỏ qua — app vẫn build, chỉ là không
      # có thông báo đẩy.
      - name: Dung lai cau hinh Firebase
        script: |
          cd $FLUTTER_PROJECT_DIR
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Da tao GoogleService-Info.plist"
          else
            echo "CANH BAO: thieu GOOGLE_SERVICE_INFO_PLIST, iOS se khong co thong bao day"
          fi

      - name: Cai dat dependencies
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter pub get

      - name: Kiem tra loi bien dich
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Cai CocoaPods (thu vien iOS)
        script: |
          cd $FLUTTER_PROJECT_DIR/ios
          pod install --repo-update

      - name: Tao chung chi va provisioning profile
        script: |
          # Dung ngay khi co lenh loi, de khong am tham bo qua buoc ky so
          set -e

          echo "===== 1. Khoi tao kho chung chi ====="
          keychain initialize

          echo "===== 2. Tao/tai chung chi + profile cho $BUNDLE_ID ====="
          # --certificate-key: khoa rieng di kem chung chi. Apple KHONG giu khoa nay,
          #   thieu no se bao "Cannot save Signing Certificates without certificate
          #   private key". Dung 1 khoa co dinh luu trong bien moi truong de moi lan
          #   build deu tai lai dung chung chi cu, khong tao chung chi moi (Apple chi
          #   cho toi da 3 chung chi phan phoi).
          # --create: tao moi neu Apple chua co.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

          echo "===== 3. Nap chung chi vao keychain ====="
          keychain add-certificates

          echo "===== 4. Gan profile vao du an Xcode ====="
          xcode-project use-profiles

          echo "===== 5. KIEM TRA KET QUA ====="
          echo "--- Provisioning profile da tai ve ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null \
            || echo "!!! KHONG co profile nao"
          echo "--- Chung chi ky so trong keychain ---"
          security find-identity -v -p codesigning \
            || echo "!!! KHONG co chung chi nao"

      - name: Build IPA
        script: |
          cd $FLUTTER_PROJECT_DIR
          # Tên phiên bản lấy thẳng từ pubspec.yaml để iOS và Android luôn cùng
          # một con số. Trước đây ghi cứng 1.0.0 nên TestFlight hiện sai bản.
          #
          # Số build cộng thêm 100 để chắc chắn lớn hơn mọi bản đã tải lên trước
          # đây (App Store Connect từ chối bản có số build không tăng). Vẫn tăng
          # dần theo số lần build của Codemagic nên không bao giờ lặp lại.
          flutter build ipa --release \
            --build-number=$(($PROJECT_BUILD_NUMBER + 100)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - kpi_mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - kpi_mobile/flutter_drive.log

    # QUAN TRỌNG: tên dưới đây phải TRÙNG KHỚP với tên integration bạn tạo trong
    # Codemagic (Teams > Integrations > App Store Connect). Nếu bạn đặt tên khác,
    # sửa lại dòng này cho khớp, nếu không build sẽ báo lỗi không tìm thấy key.
    integrations:
      app_store_connect: trilong-appstore

    publishing:
      app_store_connect:
        auth: integration

        # Gửi bản build đi duyệt External Testing (để có link công khai, sale tự cài
        # không cần thêm email từng người, tối đa 10.000 người).
        #
        # ĐIỀU KIỆN BẮT BUỘC — làm 1 lần trên App Store Connect, nếu thiếu sẽ lỗi
        # "Complete test information is required ... for external testing":
        #   - Test Information: Feedback Email + Description
        #   - Beta App Review Information: First/Last Name, Phone, Email
        #   - Sign-in required: bật, kèm tài khoản demo cho Apple đăng nhập thử
        submit_to_testflight: true

        # Tự gán bản build vào nhóm External Testing này, để người có link nhận
        # bản mới ngay mà không phải gán tay.
        # TÊN PHẢI TRÙNG KHỚP với nhóm ở TestFlight > External Testing.
        beta_groups:
          - "Sale nội bộ"

        # Chỉ bật khi muốn phát hành công khai trên App Store
        submit_to_app_store: false
      email:
        recipients:
          - hunghot041103@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------
  # 2) BUILD THỬ KHÔNG KÝ SỐ
  #    KHÔNG cần tài khoản Apple. Dùng để kiểm tra code có build được không.
  #    File tạo ra KHÔNG cài lên máy thật được — chỉ để kiểm tra.
  # ----------------------------------------------------------
  ios-unsigned:
    name: iOS - Build thu (khong can tai khoan Apple)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        FLUTTER_PROJECT_DIR: "kpi_mobile"

    scripts:
      - name: Dung lai cau hinh Firebase
        script: |
          cd $FLUTTER_PROJECT_DIR
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Da tao GoogleService-Info.plist"
          else
            echo "CANH BAO: thieu GOOGLE_SERVICE_INFO_PLIST, build thu van chay binh thuong"
          fi

      - name: Cai dat dependencies
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter pub get

      - name: Cai CocoaPods
        script: |
          cd $FLUTTER_PROJECT_DIR/ios
          pod install --repo-update

      - name: Build iOS khong ky so
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter build ios --release --no-codesign

    artifacts:
      - kpi_mobile/build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - hunghot041103@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------
  # 3) ANDROID — build APK và phát hành qua Firebase App Distribution
  #    Nhân viên nhận thông báo có bản mới ngay trên máy, không cần gửi file tay.
  #
  #    CHUẨN BỊ TRƯỚC (làm 1 lần):
  #      a) Firebase: tạo project, thêm ứng dụng Android với package
  #         "vn.trilongland.kpi", tạo nhóm tester tên "sale".
  #
  #      b) Codemagic > App settings > Environment variables, tất cả đặt vào
  #         nhóm "android_signing" (Codemagic KHÔNG có integration Firebase —
  #         service account nạp bằng biến môi trường):
  #
  #           FIREBASE_SERVICE_ACCOUNT = DÁN TOÀN BỘ nội dung file JSON tải từ
  #                                      Firebase > Settings > Service accounts
  #                                      > Generate new private key   (Secure)
  #           CM_KEYSTORE              = file .jks (chọn kiểu "Secure file")
  #           CM_KEYSTORE_PASSWORD     = mật khẩu keystore             (Secure)
  #           CM_KEY_ALIAS             = tên alias                     (Secure)
  #           CM_KEY_PASSWORD          = mật khẩu alias                (Secure)
  #
  #      (App ID không phải bí mật nên ghi thẳng ở phần vars bên dưới.)
  # ----------------------------------------------------------
  android-firebase:
    name: Android - Build APK va phat hanh Firebase
    # Gói miễn phí của Codemagic chỉ cấp máy mac_mini_m2 (linux_x2 báo lỗi
    # "instance type is not available with the current billing plan").
    # Máy Mac build Android hoàn toàn bình thường vì đã có sẵn Android SDK.
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      groups:
        - android_signing
      flutter: 3.38.5
      java: 17
      vars:
        FLUTTER_PROJECT_DIR: "kpi_mobile"
        PACKAGE_NAME: "vn.trilongland.kpi"
        # App ID của ứng dụng Android trên Firebase (Project settings > Your apps).
        # Đây là mã định danh công khai, không phải khóa bí mật.
        FIREBASE_APP_ID: "1:4323767453:android:1d2051ba4523a5e8fb1074"

    scripts:
      - name: Nap khoa ky so
        script: |
          set -e
          # Ghi keystore ra file và tạo key.properties để Gradle đọc
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/$FLUTTER_PROJECT_DIR/android/release.jks"
          cat > "$CM_BUILD_DIR/$FLUTTER_PROJECT_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/$FLUTTER_PROJECT_DIR/android/release.jks
          EOF
          echo "Da tao key.properties"

      # google-services.json KHÔNG nằm trong Git (kho công khai) nhưng plugin
      # com.google.gms.google-services BẮT BUỘC phải có, thiếu là build hỏng.
      - name: Dung lai google-services.json
        script: |
          set -e
          cd $FLUTTER_PROJECT_DIR
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "THIEU bien GOOGLE_SERVICES_JSON — build Android se hong."
            echo "Vao Codemagic > Environment variables, them bien nay (base64 cua google-services.json)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          echo "Da tao google-services.json"

      - name: Cai dat dependencies
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter pub get

      - name: Kiem tra loi bien dich
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK ban phat hanh
        script: |
          cd $FLUTTER_PROJECT_DIR
          # Số build tăng dần theo số lần build của Codemagic, để Android luôn
          # cho phép cài đè bản mới lên bản cũ.
          flutter build apk --release \
            --build-number=$(($PROJECT_BUILD_NUMBER + 10))

      - name: Kiem tra chu ky APK
        script: |
          cd $FLUTTER_PROJECT_DIR
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "Kich thuoc: $(du -h $APK | cut -f1)"

          # Xác nhận APK ký bằng khóa release, KHÔNG phải khóa debug.
          # Tìm apksigner linh hoạt vì đường dẫn SDK khác nhau giữa các máy build.
          SIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -name apksigner -type f 2>/dev/null | sort -r | head -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" | grep -i "certificate DN" \
              || echo "(khong doc duoc thong tin chu ky)"
          else
            echo "(khong tim thay apksigner - bo qua buoc kiem tra)"
          fi

    artifacts:
      - kpi_mobile/build/app/outputs/flutter-apk/app-release.apk
      - kpi_mobile/build/app/outputs/**/mapping.txt

    publishing:
      firebase:
        firebase_service_account: "$FIREBASE_SERVICE_ACCOUNT"
        android:
          app_id: $FIREBASE_APP_ID
          groups:
            - sale          # tên nhóm tester tạo trong Firebase
          artifact_type: apk
      email:
        recipients:
          - hunghot041103@gmail.com
        notify:
          success: true
          failure: true
